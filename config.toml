# Site settings
# Needs to be an absolute prefix
baseURL = "/"
title = "Casual Gaming"
theme = "fifty"
enableEmoji = true
DefaultContentLanguage = "no"

# Enter your tracking code to enable Google Analytics
googleAnalytics = ""

[params]
  # You can use Markdown syntax for urls [text](//url.to/source)
  # To create multi-line text in strings use the """example Text""" format
  #
  # All icons using Fontawesome's icon font. Look at fontawesome.io/icons
  # for more icons. The icons are represented by their corresponding
  # CSS class.

  # Provide your metadata here.
  name = "Casual Gaming"
  description = "Datatreff og spillkvelder i Trondheim"

  # Plausible, set to enable
  plausibleLocalDomain = "casualgaming.no"
  plausibleRemoteDomain = "plausible.casualgaming.no"

  # Link custom assets relative to /static
  custom_css = []
  custom_js  = []

  # Image used when shared on social media
  # Unset to disable
  # All 4 must be provided if enabled
  # Can be overridden in pages
  sharingImage = "/img/logo-large.png"
  sharingImageType = "image/png"
  sharingImageWidth = "1000"
  sharingImageHeight = "1000"

  # 404 error customization
  [params.error404]
    heading = "Siden finnes ikke"
    text = "Vennligst [gå hjem](/)."

  # Navigation Section
  [params.navigation]
    logo = "banner-logo.png"
    menu = "Meny"

    [[params.navigation.links]]
      name = "Hjem"
      url = "/"

    [[params.navigation.links]]
      name = "Om oss"
      url = "/om/"

    [[params.navigation.links]]
      name = "Spillkvelder"
      url = "/spillkveld/"

    [[params.navigation.links]]
      name = "StudLAN"
      url = "https://studlan.no"

    [[params.navigation.links]]
      name = "TrøndeLAN (historisk)"
      url = "/om/#trøndelan"

    [[params.navigation.links]]
      name = "Opptak"
      url = "/opptak/"

    [[params.navigation.links]]
      name = "For samarbeidspartnere"
      url = "/for-samarbeidspartnere/"

  # Banner section
  [params.banner]
    bannerImage = "/img/home/banner.jpg"
    logoImage = "/img/banner-logo.png"
    subtitle = "Datatreff og spillkvelder i Trondheim"

  # Tiles Section
  [params.tiles]
    enable = true

    [[params.tiles.showcase]]
      title = "Spillkvelder"
      subtitle = "Spillkvelder på Gløshaugen"
      image = "/img/home/kob.jpg"
      url = "/spillkveld/"

    [[params.tiles.showcase]]
      title = "StudLAN"
      subtitle = "Spillhelg på Gløshaugen"
      image = "/img/home/studlan.jpg"
      url = "https://studlan.no"

    [[params.tiles.showcase]]
      title = "Discord"
      subtitle = "Join the casual community"
      image = "/img/home/gaming.jpg"
      url = "https://cag.gg/discord"

    [[params.tiles.showcase]]
      title = "Opptak"
      subtitle = "Bli med i crewet"
      image = "/img/home/opptak.jpg"
      url = "/opptak/"

  # About section
  [params.about]
    enable = true
    title = "Casual Gaming"
    subtitle = """
Casual Gaming (CaG) er en ideell student- og ungdomsorganisasjon som har til formål
å skape en felles sosial arena for spillinteresserte studenter og ungdom i Trondheimsområdet.
Vi arrangerer bl.a. spillkvelder, StudLAN, <insert upcoming LAN> og mye rart sammen med andre organisasjoner.

**[Les mer om oss her.](/om)**

[Vil du støtte oss og bli medlem? Trykk her! 😊](https://cag.gg/medlem)
"""

  # Partner section
  [params.partners]
    enable = true
    title = "Samarbeidspartnere"

    [[params.partners.partner]]
      image = "/img/partners/hyperion.png"
      alt = "Hyperion – Norsk Forbund for Fantastiske Fritidsinteresser"
      backgroundColor = ""
      url = "https://n4f.no/"
      description = "Vi er medlemsforening i Hyperion – Norsk Forbund for Fantastiske Fritidsinteresser"

    [[params.partners.partner]]
      image = "/img/partners/online.png"
      alt = "Online, linjeforeningen for informatikk ved NTNU"
      backgroundColor = ""
      url = "https://online.ntnu.no/"
      description = "Vi har tilknytning til Online, linjeforeningen for informatikk ved NTNU"

    [[params.partners.partner]]
      image = "/img/partners/vanly.png"
      alt = "Vanly"
      backgroundColor = ""
      url = "https://vanly.no/"
      description = "Vanly støtter oss med god rabatt på leie av fornuftige varebiler"

    [[params.partners.partner]]
      image = "/img/partners/vyos.svg"
      alt = "VyOS"
      backgroundColor = ""
      url = "https://vyos.io/"
      description = "VyOS støtter oss med lisens til nettverksplattformen deres"

  # Grasrotandelen section
  [params.grasrotandelen]
    enable = true
    url = "https://www.norsk-tipping.no/grasrotandelen/statistikk/iframe/993396605"

